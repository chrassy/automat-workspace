# Publishes demo projects to Cloudflare Pages after every push to main.
#
# Opt-in: a project is deployed only if its folder has a `deploy.sh`. It must
# build a static site into "$OUTPUT_DIR" (an absolute path). Each demo is its
# own site served from the root, so "$BASE_PATH" is "/". Node 24 and Python
# 3.12 are available. Remove deploy.sh to take a demo down: its Cloudflare
# Pages project (automat-demo-<project>) is deleted on the next run.
#
# Pages should include the Automat tracking script (CI enforces it on change).
# The index site (automat-demos) lists every demo and serves demos.json with
# the live URLs, which the agents read.
#
# Owned by the founder. The AI developer may not modify workflows.
name: Demos

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: demos
  cancel-in-progress: false

jobs:
  build:
    name: Build demos
    runs-on: ubuntu-latest
    # The AI-written deploy.sh scripts run here: read-only token, no secrets.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build each project with a deploy.sh
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE"
          for script in */deploy.sh; do
            [ -f "$script" ] || continue
            project=$(dirname "$script")
            echo "::group::Building $project"
            (cd "$project" && OUTPUT_DIR="$SITE/$project" BASE_PATH="/" bash deploy.sh)
            if [ ! -f "$SITE/$project/index.html" ]; then
              echo "::error::$project/deploy.sh did not produce \$OUTPUT_DIR/index.html"
              exit 1
            fi
            if ! grep -q "/v1/automat.js" "$SITE/$project/index.html"; then
              echo "::warning::$project has no Automat tracking script: its results won't be measured."
            fi
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: demos
          path: ${{ runner.temp }}/site
          include-hidden-files: true
          if-no-files-found: ignore

  deploy:
    name: Publish to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    # Only this job has the Cloudflare token, and it runs no project code.
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: demos
          path: site
        continue-on-error: true  # no demos at all
      - name: Deploy each demo, remove demos that were taken down
        run: |
          set -euo pipefail
          mkdir -p site
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ensure_project() {
            curl -sf -H "$AUTH" "$API/$1" > /dev/null || \
              curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" \
                -d "{\"name\":\"$1\",\"production_branch\":\"main\"}" "$API" > /dev/null
          }
          subdomain() { curl -sf -H "$AUTH" "$API/$1" | jq -r '.result.subdomain'; }

          echo '[]' > demos.json
          for dir in site/*/; do
            [ -d "$dir" ] || continue
            project=$(basename "$dir")
            name="automat-demo-$project"
            ensure_project "$name"
            npx -y wrangler@4 pages deploy "$dir" --project-name="$name" --branch=main --commit-dirty=true
            url="https://$(subdomain "$name")"
            jq --arg p "$project" --arg u "$url" '. + [{project: $p, url: $u}]' demos.json > tmp.json && mv tmp.json demos.json
          done

          # Take down demos whose deploy.sh was removed (only automat-demo-* projects).
          curl -sf -H "$AUTH" "$API?per_page=100" | jq -r '.result[].name' | grep '^automat-demo-' | while read -r name; do
            project="${name#automat-demo-}"
            if ! jq -e --arg p "$project" 'any(.[]; .project == $p)' demos.json > /dev/null; then
              echo "Taking down $name"
              curl -sf -X DELETE -H "$AUTH" "$API/$name" > /dev/null || echo "::warning::could not delete $name"
            fi
          done

          # Index site with the list of demos and demos.json for the agents.
          mkdir -p index
          cp demos.json index/demos.json
          {
            echo '<!doctype html><html><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>Automat demos</title>'
            echo '<style>body{font:16px/1.5 system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem}a{color:#0a58ca}</style>'
            echo '</head><body><h1>Automat demos</h1><ul>'
            jq -r '.[] | "<li><a href=\"\(.url)\">\(.project)</a></li>"' demos.json
            echo '</ul></body></html>'
          } > index/index.html
          ensure_project automat-demos
          npx -y wrangler@4 pages deploy index --project-name=automat-demos --branch=main --commit-dirty=true
          echo "Demo index: https://$(subdomain automat-demos)"
          echo "Demos: $(jq -c . demos.json)"
